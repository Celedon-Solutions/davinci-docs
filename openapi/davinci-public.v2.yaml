        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CardHistoryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: dav_ak_live_... or dav_ak_test_...
      x-default: dav_ak_live_your_token
      description: |
        Personal access token. The scopes granted at issuance determine both which
        operations the key may call and the ceiling on the resource permissions it
        can exercise. Each scope family is a ladder: `projects:manage` implies
        `projects:write` and `projects:read`; `cards:manage` implies `cards:write`
        and `cards:read`; and `teams:manage` implies `teams:write` and `teams:read`.
    GrantBearer:
      type: http
      scheme: bearer
      bearerFormat: dav_gr_...
      x-default: dav_gr_your_grant
      description: |
        A session's data-plane grant, from `dataPlane.token`. Valid only on the
        data-plane host, only for the one project its session opened, and only for
        minutes.

        A grant is not an API key and the two are not interchangeable: presenting a
        grant to a control-plane operation is rejected, and an API key is not accepted
        on the data plane. The separation is deliberate — a grant is meant to be
        cheap to lose, so it reaches one project, does no more than the key that
        minted it, and is revoked when its session closes.
    ExecutionGrantBearer:
      type: http
      scheme: bearer
      bearerFormat: dav_gr_... (purpose=automation)
      x-default: dav_gr_execution_grant
      description: |
        The grant injected into a running Code object's container. It delegates
        the reach of whoever started the execution over the one project the Code
        object lives in, and it expires with the container.

        On this mount it can create, inspect, and clean up the evaluation
        sandboxes that execution owns. It cannot select an existing project as a
        target, and a sandbox-bound `purpose=evaluation` grant is refused here so
        an evaluation cannot start another one.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: |
        A value you choose to identify this request, so that retrying it does not
        repeat its effect. Reuse the same key when retrying and the original result
        is returned; use a fresh key when you mean to create something new. Keys are
        scoped to the API key that sent them (or to the user for browser sessions).
        Replayed responses include `Idempotency-Replayed: true`.
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Project id. May be compound in the form `{projectId}--{branchName}`.
    TeamProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Bare id of a project linked to a team.
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization id.
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Agile team id.
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Agile card id.
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Card-tag id.
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Card-comment id.
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Card relation junction-row id.
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Team sprint id.
    StatusId:
      name: statusId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Team workflow-status id.
    CardQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Case-insensitive substring search across card name, description, and resolution.
    CardState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, closed, all]
        default: open
      description: Project-global card lifecycle state.
    CardTagIds:
      name: tagIds
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
      style: form
      explode: true
      description: Match cards carrying any selected project tag.
    CardAssigneeIds:
      name: assigneeIds
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
      style: form
      explode: true
      description: Match cards assigned to any selected project member.
    CardIncludeUnassigned:
      name: includeUnassigned
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: OR cards with no user links into the assignee facet. This is not a sentinel assignee ID.
    CardTeamIds:
      name: teamIds
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
      style: form
      explode: true
      description: Match cards placed on any selected linked team.
    CardIncludeNoTeam:
      name: includeNoTeam
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: OR cards with no team placement into the team facet. This is not a sentinel team ID.
    CardStatusIds:
      name: statusIds
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
      style: form
      explode: true
      description: Match cards whose selected-team placement uses any selected status.
    CardSprintIds:
      name: sprintIds
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
      style: form
      explode: true
      description: Match cards whose team placement uses any selected sprint.
    CardSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - created_asc
          - created_desc
          - updated_asc
          - updated_desc
          - deadline_asc
          - deadline_desc
          - name_asc
          - name_desc
        default: created_desc
      description: Stable card sort; card ID is the deterministic tie-breaker.
    CardPageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Maximum cards returned.
    CardCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
      description: Opaque cursor returned as `meta.nextCursor` or `meta.previousCursor`.
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 132
      description: |
        Quoted or unquoted latest card `historyHeadId`. When the request body also
        contains `expectedHistoryHeadId`, both values must match. A stale head
        returns `409 CARD_HISTORY_CONFLICT` without applying the mutation.
    CardDetailLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Reference object id or storage filename.
    Branch:
      name: branch
      in: query
      required: false
      schema:
        type: string
        default: main
    BranchPath:
      name: branch
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Branch name.
    ObjectId:
      name: objectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Id of an object in the project.
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session id from `createSession`.
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Id of the authored Test object in the source project.
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Evaluation-run or Test-run id returned by its create operation.
    DataPlaneOwnerId:
      name: ownerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: |
        Id of the account or organization that owns the project, from the project's
        `ownerId`.
    DataPlaneUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: |
        Acting user id. Ignored for authorization — the acting identity comes from the
        grant, so this cannot be used to act as someone else.
    DataPlaneProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: |
        Project id, compound as `{projectId}--{branchName}`. Must be the project the
        session opened.
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^headless-'
      description: |
        The session's `dataPlane.connectionId`, which is `headless-{sessionId}`. Send
        what the session gave you and this is the only value you will ever need.

        What the server actually requires is the `headless-` prefix, and the
        difference matters in one place: a Code object addresses the data plane with
        `headless-exec-{executionId}`, because an execution holds a grant rather than
        a session. The prefix is what makes the upload be applied through a client, so
        the reference joins the parts tree instead of the bytes landing in storage
        with nothing pointing at them. An id naming no live connection is served by an
        ephemeral one.
    ParentId:
      name: parentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Id of the parts-tree object the file is attached under.
    FileName:
      name: fileName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Stored filename, in the form `{fileId}.{extension}`.
    UsageFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: |
        Only count events at or after this time. Omit for all of recorded history.
    UsageTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Only count events at or before this time.
    UsageGroupBy:
      name: groupBy
      in: query
      required: false
      schema:
        type: string
        enum: [model, project, session, day]
      description: |
        Break the totals down. Omit to receive totals only — `totals` is always
        present and always covers the whole scope, whether or not you group.
  headers:
    CardHistoryETag:
      description: Quoted latest card history head after the committed mutation.
      schema:
        type: string
    CardHistoryHeadId:
      description: Latest card history head after the committed mutation.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: |
        Malformed request parameters or body. Agile requests may return
        `INVALID_PAGINATION` or `INVALID_IDEMPOTENCY_KEY`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: |
        No credential was supplied, or the supplied credential is malformed, expired,
        or revoked. A credential that is present but unusable is never downgraded to
        an anonymous request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InsufficientScopes:
      description: API key lacks a required scope. Error code is `INSUFFICIENT_SCOPES`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        Authenticated but not authorized. Either the acting user lacks the required
        resource permission, the key's scope ceiling excludes it, or the endpoint
        rejects this credential type (`CREDENTIAL_NOT_PERMITTED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        The resource does not exist in the parent named by the path, or is hidden
        from the caller. Absence and privacy denial are deliberately
        indistinguishable so project, organization, and private-team existence
        cannot be probed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GrantRejected:
      description: |
        The grant is missing, unknown, expired, or revoked. These are one response so a
        rejected request cannot be used to learn which grants exist. Refresh the
        session to get a new grant, or create a new session if that also fails.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProjectMoved:
      description: |
        The project moved to another machine. Error code is `PROJECT_MOVED`. Retry the
        request: the next one resolves to the machine holding it now, at the same URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProjectNotRunning:
      description: |
        The project stopped running between being opened for this request and the
        request reaching it. Error code is `PROJECT_NOT_RUNNING`. Retry: the next call
        opens it again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProjectNotReady:
      description: |
        The project could not be opened in time, or no machine is currently available
        to run it. Error codes are `PROJECT_NOT_READY`, `SERVER_NOT_AVAILABLE`, and
        `SERVICE_UNAVAILABLE`. Retry after the interval in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GitFailed:
      description: |
        The git operation failed inside the engine rather than being refused. Error
        code is `GIT_OPERATION_FAILED`, or `CHANGES_UNAVAILABLE` and
        `COMMIT_NOT_RECORDED` for the two cases where a specific step is known to have
        produced nothing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Request rate exceeded, either globally or for this key.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        The resource's current state no longer permits this operation, or a unique
        name, hierarchy, dependency, or lifecycle invariant would be violated.
        Examples include an active sprint that must be completed first, a duplicate
        card-tag name, or a dependency cycle. Idempotent creates may return
        `IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_REQUEST_IN_PROGRESS`; the latter
        includes `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CardHistoryConflict:
      description: |
        The supplied `If-Match`, `expectedHistoryHeadId`, or
        `expectedHistoryHeadIds` no longer matches committed card history. Error
        code is `CARD_HISTORY_CONFLICT`; `error.details` includes the expected
        head, current head and sequence, plus recent card activity. No part of
        the requested card mutation is applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyUnavailable:
      description: |
        Idempotency protection is temporarily unavailable. Error code is
        `IDEMPOTENCY_UNAVAILABLE`; the response includes `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InfrastructureFailure:
      description: |
        The request was understood, but required evaluation infrastructure or
        evidence was unavailable. Error codes include `EVALUATION_SCOPE_MISSING`,
        `EVALUATION_AGENT_FAILED`, `EVALUATION_TIMEOUT`,
        `EVALUATION_EVIDENCE_MISSING`, `EVALUATION_OBSERVATION_INVALID`, and
        `EVALUATION_CLEANUP_FAILED`. These conditions are never converted to a
        successful quality observation or a skipped Test.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    NullableHistoryHeadId:
      type: [string, 'null']
      format: uuid
      description: Latest committed card-history row ID; null only before a card has history.
    HistoryHeadSequence:
      type: string
      pattern: '^\d+$'
      description: Globally monotonic card-history sequence.
    NullableHistoryHeadSequence:
      type: [string, 'null']
      pattern: '^\d+$'
      description: Globally monotonic card-history sequence.
    ExpectedHistoryHeadsRequest:
      type: object
      properties:
        expectedHistoryHeadIds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NullableHistoryHeadId'
          description: Latest known history head keyed by every card the bulk write may affect.
      additionalProperties: false
    OrganizationSummary:
      type: object
      required:
        - id
        - name
        - slug
        - handle
        - handleType
        - description
        - tier
        - visibility
        - createdAt
        - updatedAt
        - isFrozen
        - isTeamOwned
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        handle:
          type: string
        handleType:
          type: string
        handleVerifiedAt:
          type: [string, 'null']
          format: date-time
        description:
          type: string
        tier:
          type: string
        visibility:
          type: string
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
        isFrozen:
          type: boolean
        isTeamOwned:
          type: boolean
        memberCount:
          type: integer
          minimum: 0
        joinedAt:
          type: [string, 'null']
          format: date-time
        role:
          type: string
        roleName:
          type: string
        ownedProjectCount:
          type: integer
          minimum: 0
        maxOwnedProjects:
          type: integer
          minimum: 0
      additionalProperties: false
    OrganizationsResponse:
      type: object
      required: [orgs]
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'
      additionalProperties: false
    AgileCard:
      type: object
      required:
        - id
        - name
        - description
        - resolution
        - created_by_user
        - created_at
        - updated_at
        - deadline
        - is_open
        - project_id
        - effort
      properties: &AgileCardProperties
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        resolution:
          type: [string, 'null']
          maxLength: 10000
          description: Optional Markdown resolution; closing or reopening the card does not clear it.
        created_by_user:
          type: [string, 'null']
          format: uuid
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        deadline:
          type: [string, 'null']
          format: date-time
        is_open:
          type: boolean
        project_id:
          type: string
          format: uuid
        effort:
          type: [integer, 'null']
          minimum: 0
          description: Unit-agnostic estimate, commonly interpreted as story points or hours.
      additionalProperties: true
    CardResponse:
      type: object
      required: [card, historyHeadId, historyHeadSequence]
