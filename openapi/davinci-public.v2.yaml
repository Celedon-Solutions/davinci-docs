    ErrorEnvelope:
      description: |
        The error shape for every failure on this API, whether it was refused by the
        credential layer before reaching a domain or by the domain itself.

        Branch on `code`, which is stable. `message` is for a person reading a log or
        a dialog and may be reworded. `details` carries fields specific to one
        failure — a project-limit refusal reports its numbers there — and is absent
        when there are none.
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
      additionalProperties: true
    CreateEvaluationRunRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          description: Human-readable sandbox name used in logs.
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 900
          description: Hard cleanup deadline, independent of Code execution timeout.
      additionalProperties: false
    EvaluationRun:
      type: object
      required:
        - runId
        - sourceProjectId
        - status
        - sandbox
        - createdAt
        - expiresAt
        - cleanup
      properties:
        runId:
          type: string
          format: uuid
        sourceProjectId:
          type: string
        testId:
          type: [string, 'null']
          description: |
            The Test whose Results Value started the Code, when a Test did.
            Absent for a Code object run directly.
        testRunId:
          type: [string, 'null']
          format: uuid
          description: The Test run that started the Code, when one did.
        codeExecutionId:
          type: string
        sessionId:
          type: string
          format: uuid
          description: Headless target session attached to the evaluation data-plane grant.
        status:
          $ref: '#/components/schemas/EvaluationRunStatus'
        sandbox:
          $ref: '#/components/schemas/EvaluationSandbox'
        dataPlane:
          $ref: '#/components/schemas/EvaluationDataPlaneAccess'
        evidence:
          $ref: '#/components/schemas/EvaluationEvidence'
        quality:
          $ref: '#/components/schemas/QualityObservation'
        failure:
          $ref: '#/components/schemas/RunFailure'
        cleanup:
          $ref: '#/components/schemas/EvaluationCleanup'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    EvaluationRunStatus:
      type: string
      enum: [provisioning, ready, running, cleaning, cleaned, failed, expired]
      description: |
        `ready` means the target is pinned and its grant can be used. `failed`
        is an infrastructure failure, not a low quality score. `cleaned` and
        `expired` are terminal and carry no usable grant.
    EvaluationSandbox:
      type: object
      required: [projectId, branchName, ephemeral]
      properties:
        projectId:
          type: string
          description: Server-chosen target project. It is never accepted from the create body.
        branchName:
          type: string
        name:
          type: string
        ephemeral:
          type: boolean
          description: Always true for an evaluation-created target.
        deleteAfter:
          type: string
          format: date-time
      additionalProperties: true
    EvaluationDataPlaneAccess:
      allOf:
        - $ref: '#/components/schemas/DataPlaneAccess'
        - type: object
          required: [purpose]
          properties:
            purpose:
              type: string
              const: evaluation
              description: |
                Target-bound evaluation authority. Ordinary data-plane/execution
                grants remain denied from agent and git routes; this purpose
                admits only the target agent, and still denies git.
          additionalProperties: true
    EvaluationEvidence:
      type: object
      required: [capturedAt, transcript, tree, usage]
      properties:
        capturedAt:
          type: string
          format: date-time
        transcript:
          $ref: '#/components/schemas/AgentTranscript'
        tree:
          $ref: '#/components/schemas/ProjectTree'
        usage:
          $ref: '#/components/schemas/UsageResponse'
        seededObjectIds:
          type: array
          items:
            type: string
        artifacts:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              mediaType:
                type: string
              fileId:
                type: string
              sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
            additionalProperties: true
        summary:
          type: object
          additionalProperties: true
      additionalProperties: true
    QualityObservation:
      type: object
      required: [value]
      properties:
        value:
          type: number
          description: Finite numeric observation returned to native Test evaluation criteria.
        unit:
          type: string
        rubric:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
      additionalProperties: false
    EvaluationCleanup:
      type: object
      required: [status, requested]
      properties:
        status:
          type: string
          enum: [not_started, pending, completed, failed]
        requested:
          type: boolean
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        grantsRevoked:
          type: integer
          minimum: 0
        projectDeleted:
          type: boolean
        failure:
          $ref: '#/components/schemas/RunFailure'
      additionalProperties: true
    CreateTestRunRequest:
      type: object
      properties:
        branch:
          type: string
          maxLength: 255
          description: Branch containing the authored Test. Defaults to `main`.
      additionalProperties: false
    TestRun:
      type: object
      required: [runId, projectId, branchName, testId, status, createdAt]
      properties:
        runId:
          type: string
          format: uuid
        projectId:
          type: string
        branchName:
          type: string
        testId:
          type: string
        codeObjectId:
          type: string
        evaluationRunId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TestRunStatus'
        observation:
          type: number
          description: Finite numeric observation committed to the Test's Results Value.
        unit:
          type: string
        verdict:
          $ref: '#/components/schemas/TestRunVerdict'
        evidence:
          type: object
          additionalProperties: true
          description: |
            Fixture-defined structured evidence. SYSTEM quality fixtures include
            transcript, final-tree, usage, and rubric summaries; callers must
            tolerate additional fixture-specific fields.
        failure:
          $ref: '#/components/schemas/RunFailure'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    TestRunStatus:
      type: string
      enum: [queued, starting, running, evaluating, cancelling, completed, failed, cancelled, timed_out]
      description: |
        `completed`, `failed`, `cancelled`, and `timed_out` are terminal.
        `failed` means the Code execution or evaluation infrastructure failed;
        a valid low observation still completes and may resolve to a failing
        Test verdict.
    TestRunVerdict:
      type: object
      required: [name]
      properties:
        name:
          type: string
        score:
          type: [number, 'null']
        criteriaTarget:
          type: string
      additionalProperties: true
    RunFailure:
      type: object
      required: [code, message, infrastructure]
      properties:
        code:
          type: string
          enum:
            - EVALUATION_SCOPE_MISSING
            - EVALUATION_AGENT_FAILED
            - EVALUATION_TIMEOUT
            - EVALUATION_EVIDENCE_MISSING
            - EVALUATION_OBSERVATION_INVALID
            - EVALUATION_CLEANUP_FAILED
            - CODE_EXECUTION_FAILED
            - TEST_CANCELLED
            - TEST_RUN_FAILED
            - TEST_RUN_TIMED_OUT
        message:
          type: string
        infrastructure:
          type: boolean
          description: True when no quality verdict may be inferred from this failure.
        details:
          type: object
          additionalProperties: true
      additionalProperties: true
    ListProjectsResponse:
      type: object
      required: [owned, shared]
      properties:
        owned:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        shared:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
      additionalProperties: true
    ProjectSummary:
      allOf:
        - $ref: '#/components/schemas/ProjectMetadata'
        - type: object
          properties:
            inUse:
              type: boolean
              description: True when a Design Engine instance is currently running for this project.
            git:
              $ref: '#/components/schemas/GitState'
          additionalProperties: true
    GitState:
      type: object
      required: [initialized, branches]
      properties:
        initialized:
          type: boolean
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      additionalProperties: true
    Branch:
      type: object
      required: [name]
      properties:
        name:
          type: string
        inUse:
          type: boolean
      additionalProperties: true
    GetProjectResponse:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: '#/components/schemas/ProjectMetadata'
      additionalProperties: true
    ProjectMetadata:
      description: |
        Stored project metadata. `ProjectSummary` is this plus the live `inUse` and
        `git` fields that only the list endpoint computes.
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: [string, 'null']
        description:
          type: [string, 'null']
        owner:
          type: string
          description: User id or organization id that owns the project.
        createdBy:
          type: [string, 'null']
        visibility:
          type: string
        version:
          type: string
        created:
          type: [string, 'null']
          format: date-time
        lastModified:
          type: [string, 'null']
          format: date-time
        storageUsedBytes:
          type: integer
          minimum: 0
        transferState:
          type: [string, 'null']
        collaborators:
          type: array
          items:
            type: string
          description: User ids with effective access, including access inherited from an organization.
        pendingCollaborators:
          type: array
          items:
            type: string
      additionalProperties: true
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: Required unless initialPrompt is supplied.
        initialPrompt:
          type: string
          maxLength: 4000
          description: Staged as the creator's first agent message when a client connects.
        description:
          type: string
        orgId:
          type: [string, 'null']
          description: Create the project under an organization instead of the calling user.
        visibility:
          type: string
          enum: [private, internal, public]
          default: private
        autoName:
          type: boolean
          default: false
          description: Derive the project name from initialPrompt.
        skipInitialCommit:
          type: boolean
          default: false
      additionalProperties: false
    CreateProjectResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
        projectSlug:
          type: [string, 'null']
        ownerSlug:
          type: [string, 'null']
        projectList:
          $ref: '#/components/schemas/ListProjectsResponse'
      additionalProperties: true
    UpdateProjectRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        visibility:
          type: string
          enum: [private, internal, public]
        readme:
          type: string
        tags:
          type: array
          items:
            type: string
        units:
          type: string
      additionalProperties: true
    UpdateProjectResponse:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: '#/components/schemas/ProjectMetadata'
      additionalProperties: true
    OpenProjectRequest:
      type: object
      properties:
        branch:
          type: string
          default: main
        oldProjectId:
          type: string
          description: Previously open project to close as part of switching.
        initialPrompt:
          type: string
          maxLength: 4000
      additionalProperties: false
    OpenProjectResponse:
      type: object
      required: [projectId, branchName, alreadyLoaded, permissions]
      properties:
        projectId:
          type: string
        branchName:
          type: string
        alreadyLoaded:
          type: boolean
          description: True when the project was already running and this call reused the instance.
        metadata:
          $ref: '#/components/schemas/ProjectMetadata'
        permissions:
          type: array
          items:
            type: string
        url:
          type: string
          description: |
            Design Engine replica URL. Present only for browser access-token callers;
            omitted for API keys.
        serverToken:
          type: string
          description: |
            Project instance credential. Present only for browser access-token
            callers; omitted for API keys.
      additionalProperties: true
    ListBranchesResponse:
      type: object
      required: [branches]
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      additionalProperties: true
    ListPackagesResponse:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ListFilesResponse:
      type: object
      required: [files, count]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFile'
        count:
          type: integer
          minimum: 0
      additionalProperties: true
    ProjectFile:
      type: object
      description: |
        A file attached to the project, described by the reference object that owns
        it. Included references and Onshape-linked references are not files in this
        sense and are not listed.
      required: [objectId, name, filename, fileType, size]
      properties:
        objectId:
          type: string
          description: Id of the reference object. Pass as `fileId` to download or delete.
        name:
          type: string
          description: Display name of the object.
        filename:
          type: string
          description: |
            Stored name from `assets.primary.fileName`, or `{objectId}{fileType}` for
            a legacy snapshot. This is the `fileName` the data-plane download takes.
        fileType:
          type: string
          description: Extension including the leading dot.
        parentId:
          type: [string, 'null']
          description: Object the reference is attached under.
        size:
          type: [integer, 'null']
          minimum: 0
          description: |
            Byte size from `assets.primary.byteSize`, or the legacy stored-file size.
            Null when the reference exists but no size metadata or legacy blob exists.
      additionalProperties: true
    ProjectTree:
      type: object
      description: |
        Flat list of project objects excluding the project object itself. New
        projects contain reserved `Model` and `Library` packages whose `parent`
        is the project id; callers must not assume a parentless node exists.
      required: [objectCount, tree]
      properties:
        objectCount:
          type: integer
          minimum: 0
          description: Total objects in the project, including the project object itself.
        tree:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
      additionalProperties: true
    TreeNode:
      type: object
      description: |
        One object, as a node. Parentage is expressed by `parent` and `childrenCount`
        rather than by nesting, so the array is flat and a node can be read without
        walking to it.
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        parent:
          type: [string, 'null']
        childrenCount:
          type: integer
          minimum: 0
      additionalProperties: true
    GetObjectResponse:
      type: object
      required: [object]
      properties:
        object:
          type: object
          description: |
            The full object, with computed values resolved. Fields vary by `type`, so
            only `id`, `name`, and `type` are guaranteed.
          required: [id, name, type]
          properties:
            id:
              type: string
            name:
              type: string
            type:
              type: string
          additionalProperties: true
      additionalProperties: true
    AddObjectsRequest:
      type: object
      required: [objects]
      properties:
        objects:
          type: object
          minProperties: 1
          description: |
            Objects to add, keyed by the id each should take. A key is an id, so it
            must be a UUID — mint one per object. Ids must be unique within the
            project; reusing one overwrites, which is why guessable keys are not
            accepted.

            Each body is validated against the schema for its `type`. Fields
            differ by type, anything the type does not define is refused rather
            than dropped, and every field is optional except `type` — the model
            supplies the rest.

            `tags` is refused here rather than accepted and discarded: creation
            does not carry them. Assign them once the object exists.
          additionalProperties:
            type: object
            required: [type]
            properties:
              type:
                type: string
                description: |
                  Any object type the model defines: `task`, `requirement`, `part`,
                  `attribute`, `risk`, `test`, `package`, and the rest. A 400 for an
                  unrecognised type lists them all in `details.validTypes`.
              name:
                type: string
              parent:
                type: string
                format: uuid
                description: Overrides `parentId` for this object.
            additionalProperties: true
        parentId:
          type: [string, 'null']
          format: uuid
          description: |
            Parent for objects that do not name one themselves. An id, so a UUID.
      additionalProperties: false
    AddObjectsResponse:
      type: object
      required: [addedCount, objectIds]
      properties:
        addedCount:
          type: integer
          minimum: 1
        objectIds:
          type: array
          items:
            type: string
      additionalProperties: true
    DeleteObjectResponse:
      type: object
      required: [deletedCount, deletedObjectIds]
      properties:
        deletedCount:
          type: integer
          minimum: 1
        deletedObjectIds:
          type: array
          minItems: 1
          items:
            type: string
      additionalProperties: true
    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        sourceBranch:
          type: string
          description: Branch to copy from. Defaults to the `branch` query parameter, or `main`.
      additionalProperties: false
    CreateBranchResponse:
      type: object
      required: [branch, sanitized]
      properties:
        branch:
          type: object
          required: [name, sourceBranch]
          properties:
            name:
              type: string
              description: The name actually created, which is the requested one unless it was sanitized.
            sourceBranch:
              type: string
            commit:
              type: [string, 'null']
              description: Commit the new branch starts from.
          additionalProperties: true
        sanitized:
          type: boolean
          description: True when the created name differs from the requested one.
      additionalProperties: true
    DeleteBranchResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
        disconnectedUsers:
          type: integer
          minimum: 0
          description: Clients disconnected by a forced delete.
      additionalProperties: true
    CommitRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
        author:
          type: object
          required: [name]
          properties:
            name:
              type: string
            email:
              type: string
          description: Defaults to the acting user.
          additionalProperties: false
      additionalProperties: false
    CommitResponse:
      type: object
      required: [commit]
      properties:
        commit:
          type: object
          required: [hash]
          properties:
            hash:
              type: string
            message:
              type: string
            author:
              type: [string, 'null']
            timestamp:
              type: [string, 'null']
              format: date-time
            branch:
              type: string
            stats:
              type: [object, 'null']
              properties:
                additions:
                  type: integer
                modifications:
                  type: integer
                deletions:
                  type: integer
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    ChangesResponse:
      type: object
      description: |
        Uncommitted changes on a branch, as object ids. One shape regardless of
        whether the branch is loaded — the answer comes from memory when it is and
        from a git diff when it is not, and the difference is not published.
      required: [hasChanges, totalObjectChanges, added, modified, deleted, deletedObjects]
      properties:
        hasChanges:
          type: boolean
        committedHash:
          type: [string, 'null']
          description: Commit the changes are measured against.
        totalObjectChanges:
          type: integer
          minimum: 0
        added:
          type: array
          items:
            type: string
        modified:
          type: array
          items:
            type: string
        deleted:
          type: array
          items:
            type: string
        deletedObjects:
          type: array
          description: |
            Enough of each deleted object to name it, since it can no longer be read
            from the project.
          items:
            type: object
            required: [objectId]
            properties:
              objectId:
                type: string
              name:
                type: [string, 'null']
              type:
                type: [string, 'null']
              parentId:
                type: [string, 'null']
            additionalProperties: true
      additionalProperties: true
    ObjectHistoryResponse:
      type: object
      required: [objectId, found, totalChanges, history]
      properties:
        objectId:
          type: string
        found:
          type: boolean
          description: False when no commit on this branch ever touched the object.
        totalChanges:
          type: integer
          minimum: 0
        history:
          type: array
          description: Newest first. Commits that did not change the object are omitted.
          items:
            $ref: '#/components/schemas/ObjectHistoryEntry'
      additionalProperties: true
    ObjectHistoryEntry:
      type: object
      required: [commit, changeType]
      properties:
        commit:
          type: object
          required: [hash]
          properties:
            hash:
              type: string
            shortHash:
              type: string
            message:
              type: string
            timestamp:
              type: string
              format: date-time
            author:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
              additionalProperties: true
          additionalProperties: true
        changeType:
          type: string
          enum: [created, modified, deleted]
        state:
          type: [object, 'null']
          description: The object as of this commit. Null when the commit deleted it.
          additionalProperties: true
        changes:
          type: object
          description: Field-level difference from the previous commit.
          additionalProperties: true
      additionalProperties: true
    CreateSessionRequest:
      type: object
      properties:
        branch:
          type: [string, 'null']
          description: Branch to open. Defaults to the branch in a compound project id, or `main`.
        scopes:
          type: array
          items:
            type: string
            enum:
              - projects:read
              - projects:write
              - projects:manage
              - sessions:manage
              - agent:message
              - webhooks:receive
              - usage:read
          description: |
            Narrow the grant below the key's own scopes. Omit to inherit them. Asking
            for a scope the key does not hold is refused rather than silently reduced.
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 900
          description: Grant lifetime. Capped at one hour regardless of what is requested.
      additionalProperties: false
    Session:
      type: object
      required: [sessionId, projectId, branchName, ownerId, dataPlane]
      properties:
        sessionId:
          type: string
          format: uuid
        projectId:
          type: string
          description: Bare project id, without the branch suffix.
        branchName:
          type: string
        ownerId:
          type: string
          description: |
            Account or organization that owns the project. Files live under the owner's
            storage namespace, not the caller's, which is why a shared or org-owned
            project needs this rather than your own user id.
        dataPlane:
          $ref: '#/components/schemas/DataPlaneAccess'
        agent:
          $ref: '#/components/schemas/AgentState'
      additionalProperties: true
    AgentState:
      type: object
      description: |
        What the session's agent is doing. Present on a session read, absent on create
        because nothing has been asked of the agent yet.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AgentStatus'
        taskId:
          type: [string, 'null']
          description: Identifies the run. Also names the stored conversation.
        lastMessageId:
          type: [string, 'null']
          description: The `messageId` of the most recent prompt the agent took.
      additionalProperties: true
    AgentStatus:
      type: string
      description: |
        - `no_session` — the machine has no record of this session; it lapsed or the
          project restarted. Create a new one.
        - `project_not_running` — the session is known but its project has unloaded.
        - `idle` — the session is live and no run has been started.
        - `starting` — a run is being set up.
        - `running` — a run is in progress.
        - `paused` — a run was stopped and can be continued with a new prompt.
        - `completed` — the run finished.
        - `failed` — the run ended in an error. The transcript says why.
        - `unknown` — the machine could not be reached for this field. Retry; anything
          else in the same response is still valid.

        `paused`, `completed`, and `failed` are terminal for a run.
      enum:
        - no_session
        - project_not_running
        - idle
        - starting
        - running
        - paused
        - completed
        - failed
        - unknown
    SendAgentMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 100000
          description: What you want the agent to do.
        messageId:
          type: string
          description: |
            Your own id for this prompt, echoed back and recorded in the transcript.
            Generated for you if omitted.
        context:
          type: object
          description: |
            Opaque data kept with the session and returned to your webhook alongside the
            agent's replies. Davinci does not interpret it.
          additionalProperties: true
        model:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[a-z0-9][a-z0-9._:-]*$'
          description: |
            A model key returned by `listAgentModels`. Omit it to use the calling
            account's default model. The choice applies to this prompt; every prompt
            that omits it uses the account default.
        modelOptions:
          type: object
          maxProperties: 32
          description: |
            Model configuration keyed by the option keys returned for the selected
            model by `listAgentModels`. Values may be strings, numbers, or booleans.
            Omitted options use that model's effective account defaults.
          additionalProperties:
            $ref: '#/components/schemas/AgentModelOptionValue'
        webSearch:
          type: boolean
          default: false
          description: Whether the agent may use web search for this prompt.
        persona:
          type: string
          maxLength: 200
          description: |
            The id of a persona the project defines, which sets who the agent is for
            this prompt and every one after it in the session. Omit to keep whichever
            persona the session is already running under; omitting it on the first
            prompt uses the project's default.

            This is an id, not a persona. An object is refused with `INVALID_PERSONA`,
            because a persona's name, purpose and approach are written into the system
            prompt — accepting one here would let a caller rewrite the instructions
            that decide what the agent will refuse to do. Define personas in the
            project, then name one.

            An id the project does not define is refused with `UNKNOWN_PERSONA` rather
            than quietly falling back to a default.
      additionalProperties: false
    AgentModelOptionValue:
      description: A typed model option value.
      oneOf:
        - type: string
        - type: number
        - type: boolean
    AgentModelOptionChoice:
      type: object
      required: [value, label, description]
      properties:
        value:
          $ref: '#/components/schemas/AgentModelOptionValue'
        label:
          type: string
        description:
          type: [string, 'null']
      additionalProperties: false
    AgentModelOption:
      type: object
      required: [key, label, description, type, defaultValue]
      properties:
        key:
          type: string
          description: Key to use in `SendAgentMessageRequest.modelOptions`.
        label:
          type: string
        description:
          type: [string, 'null']
        type:
          type: string
          enum: [enum, boolean]
        defaultValue:
          $ref: '#/components/schemas/AgentModelOptionValue'
        choices:
          type: array
          description: Allowed values for an `enum` option.
          items:
            $ref: '#/components/schemas/AgentModelOptionChoice'
        trueLabel:
          type: string
          description: Display label for `true` on a boolean option.
        falseLabel:
          type: string
          description: Display label for `false` on a boolean option.
      additionalProperties: false
    AgentModel:
      type: object
      required: [key, name, isDefault, options]
      properties:
        key:
          type: string
          description: Stable selector key accepted by `SendAgentMessageRequest.model`.
        name:
          type: string
          description: Human-readable model name.
        isDefault:
          type: boolean
          description: Whether this is the account profile's default chat model.
        options:
          type: array
          description: Effective model controls and defaults available to this account.
          items:
            $ref: '#/components/schemas/AgentModelOption'
      additionalProperties: false
    ListAgentModelsResponse:
      type: object
      required: [defaultModel, models]
      properties:
        defaultModel:
          type: string
          description: Key used when an agent message omits `model`.
        models:
          type: array
          items:
            $ref: '#/components/schemas/AgentModel'
      additionalProperties: false
    SendAgentMessageResponse:
      type: object
      required: [sessionId, taskId, messageId, status]
      properties:
        sessionId:
          type: string
          format: uuid
        taskId:
          type: string
          description: The run the prompt joined.
        messageId:
          type: string
        status:
          type: string
          description: Always `message_delivered` — a refusal is a `409`, not a status here.
      additionalProperties: true
    AgentTranscript:
      type: object
      required: [sessionId, taskId, source, status, entryCount, messages]
      properties:
        sessionId:
          type: string
          format: uuid
        taskId:
          type: string
        source:
          type: string
          enum: [live, persisted, none]
          description: |
            Where the answer came from. `live` is current; `persisted` is the copy saved
            when a run ended, and so lags a run in progress.
        status:
          $ref: '#/components/schemas/AgentStatus'
        entryCount:
          type: integer
          minimum: 0
          description: Entries in the whole conversation, not just the returned window.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
          description: Oldest first. Bounded by `limit`, taken from the end.
      additionalProperties: true
    AgentMessage:
      type: object
      required: [index, role, kind]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in the whole conversation, so a window can be placed.
        role:
          type: string
          enum: [user, agent]
        kind:
          type: string
          description: |
            `text` for what was said, `thought` for the agent's reasoning, `tool` for a
            tool it used, `error` for a failure it hit. Treat an unrecognized value as
            informational rather than as a problem — new kinds can appear.
        text:
          type: string
          description: The content. For a `tool` entry, the tool's name.
        timestamp:
          type: [integer, 'null']
          description: Milliseconds since the epoch.
        messageId:
          type: string
          description: Present on your own prompts, matching what you sent.
        tool:
          $ref: '#/components/schemas/AgentToolUse'
      additionalProperties: true
    AgentToolUse:
      type: object
      description: Present only on entries whose `kind` is `tool`.
      properties:
        name:
          type: [string, 'null']
        status:
          type: [string, 'null']
          description: |
            `working` while it runs, `complete` when it succeeded, otherwise the severity
            of what went wrong.
        params:
          description: The arguments the agent chose. Null when the tool takes none.
        result:
          description: What the tool returned. Shape is the tool's own.
        error:
          type: string
          description: Present when the tool failed.
      additionalProperties: true
    StopAgentResponse:
      type: object
      required: [sessionId, taskId, stopped, status]
      properties:
        sessionId:
          type: string
          format: uuid
        taskId:
          type: string
        stopped:
          type: boolean
          description: |
            False when there was no run to stop, which is not a failure — you asked for
            a state you already had.
        status:
          $ref: '#/components/schemas/AgentStatus'
      additionalProperties: true
    InvokeToolRequest:
      type: object
      required: [toolbox, tool]
      properties:
        toolbox:
          type: string
          maxLength: 200
          description: Toolbox holding the tool, for example `Core`.
        tool:
          type: string
          maxLength: 200
        params:
          type: object
          description: Arguments for the tool. Validated by the tool, not here.
          additionalProperties: true
      additionalProperties: false
    InvokeToolResponse:
      type: object
      required: [sessionId, toolbox, tool, isError, content]
      properties:
        sessionId:
          type: string
          format: uuid
        toolbox:
          type: string
        tool:
          type: string
        isError:
          type: boolean
          description: |
            Always false here — a tool that reported an error is answered as `422`, so a
            `200` means the tool succeeded.
        content:
          $ref: '#/components/schemas/ToolResultContent'
        structuredContent:
          type: object
          description: Present when the tool returns structured output as well as text.
          additionalProperties: true
      additionalProperties: true
    ToolResultContent:
      type: object
      required: [text, parts]
      properties:
        text:
          type: string
          description: Every text part the tool returned, joined by newlines.
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            Non-text parts, such as images, passed through with their `type` intact.
      additionalProperties: true
    UsageResponse:
      type: object
      required: [scope, asOf, totals]
      properties:
        scope:
          type: string
          enum: [account, project, session]
          description: What the numbers cover, determined by the path you called.
        projectId:
          type: string
          description: Present on the project and session reads. Always the bare id.
        sessionId:
          type: string
          format: uuid
          description: Present on the session read.
        asOf:
          type: [string, 'null']
          format: date-time
          description: |
            When the newest counted event was recorded, or null when the scope holds
            none. This is the honest bound on freshness: the engine reports usage on an
            interval, so a run's last few seconds may not be included. Null means
            "nothing here", not "nothing yet" — a scope with no usage looks the same
            either way, and inventing a timestamp would hide that.
        totals:
          $ref: '#/components/schemas/UsageTotals'
        groupBy:
          type: string
          enum: [model, project, session, day]
          description: Echoed back when you asked for a breakdown.
        groups:
          type: array
          description: |
            One entry per group, largest spend first — except `day`, which is
            chronological. Absent unless you passed `groupBy`.
          items:
            $ref: '#/components/schemas/UsageGroup'
      additionalProperties: true
    UsageTotals:
      type: object
      required: [credits, promptTokens, completionTokens, reasoningTokens, cacheWriteTokens, cacheReadTokens, eventCount]
      properties:
        credits:
          type: number
          description: Credits charged, to six decimal places.
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        reasoningTokens:
          type: integer
          description: Thinking tokens, charged at the completion rate.
        cacheWriteTokens:
          type: integer
        cacheReadTokens:
          type: integer
        eventCount:
          type: integer
          description: |
            Charged calls counted. Not all of them are token-priced — image generation
            and web search are charged per call, so a non-zero `credits` with zero
            tokens is normal rather than a gap.
      additionalProperties: true
    UsageGroup:
      allOf:
        - $ref: '#/components/schemas/UsageTotals'
        - type: object
          description: |
            Totals for one group. Which identifying field is present depends on
            `groupBy`, and any of them may be null — usage with no project, for example
            naming a new project, is real usage that belongs to no project.
          properties:
            provider:
              type: [string, 'null']
              description: Present when grouping by model.
            model:
              type: [string, 'null']
              description: Present when grouping by model.
            projectId:
              type: [string, 'null']
              description: Present when grouping by project.
            sessionId:
              type: [string, 'null']
              description: Present when grouping by session.
            day:
              type: [string, 'null']
              format: date-time
              description: Midnight UTC of the day. Present when grouping by day.
          additionalProperties: true
    DataPlaneAccess:
      type: object
      description: |
        Everything needed to address the data plane: where to send, what to send with,
        and the path parameters that are not obvious from the project id alone.
      required: [url, token, expiresAt, connectionId, ownerId, userId, projectKey, operations]
      properties:
        url:
          type: string
          format: uri
          description: |
            Base URL for data-plane operations. Names no specific machine, so it stays
            valid if the project moves.
        token:
          type: string
          description: |
            The grant, `dav_gr_…`. Returned only here and only once — it is not stored
            in recoverable form, so a lost grant is replaced by refreshing the session
            rather than looked up.
        expiresAt:
          type: string
          format: date-time
        connectionId:
          type: string
          description: Pass as the `connectionId` path parameter on upload.
        ownerId:
          type: string
          description: Pass as the `ownerId` path parameter.
        userId:
          type: string
          description: Pass as the `userId` path parameter on upload.
        projectKey:
          type: string
          description: |
            Pass as the `projectId` path parameter. Compound form
            `{projectId}--{branchName}`, since the data plane addresses a branch.
        operations:
          type: array
          items:
            type: string
          description: Data-plane operations this grant authorizes.
      additionalProperties: true
    DeleteSessionResponse:
      type: object
      required: [success, sessionId]
      properties:
        success:
          type: boolean
        sessionId:
          type: string
          format: uuid
        revokedGrants:
          type: integer
          minimum: 0
          description: How many live grants the close revoked.
      additionalProperties: true
    UploadFileRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        objectName:
          type: string
          description: Display name for the created object. Defaults to the filename.
        keepAsArchive:
          type: boolean
          default: false
          description: |
            Preserve a ZIP or 7z upload as one archive reference instead of
            extracting it immediately. Set this when the archive will be passed
            to `session.extract_archive()` later.
      # Closed deliberately. Other engine form fields used for progress tracking
      # and import options remain outside the published contract.
      additionalProperties: false
    UploadFileResponse:
      type: object
      description: |
        The objects the upload created, keyed by id.

        One file does not always mean one object. A STEP assembly becomes a tree,
        a PDF becomes a document plus a page image per page, and a source file
        becomes a code object — so the answer is a map rather than a single
        record. A plain file that needs no conversion yields exactly one entry.
      required: [object]
      properties:
        object:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UploadedObject'
      additionalProperties: true
    UploadedObject:
      type: object
      description: |
        One object in the parts tree. Fields beyond these vary by `type`, so treat
        this as the shape you can rely on rather than the whole record.
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          description: |
            What the file became: `reference` for a stored file, `geometry` or
            `assembly` for imported CAD, `code` for an imported source file.
        parent:
          type: string
          description: Id of the object this was attached under.
        children:
          type: array
          items:
            type: string
        fileType:
          type: string
          description: |
            Extension of the stored blob, including the leading dot. Present on
            objects that own a file. Concatenated with `id` this gives the
            `fileName` that downloads it.
        fileSize:
          type: integer
          minimum: 0
      additionalProperties: true
