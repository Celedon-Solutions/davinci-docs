  /api/v2/orgs/{orgId}/teams/{teamId}/cards/{cardId}/sprint-link:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/CardId'
    patch:
      operationId: updateTeamCardSprint
      tags: [Teams]
      summary: Move a board card between sprints
      description: |
        Moves the card to a sprint on this team, or to the backlog when
        `sprintId` is null, and records both sides of the membership change.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/team/team.routes.js
      x-required-scopes: [teams:write, cards:write]
      x-sdk-methods:
        typescript: client.teams.cards.updateSprint
        python: client.teams.cards.update_sprint
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamCardSprintRequest'
      responses:
        '200':
          description: Updated board placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCardLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CardHistoryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/orgs/{orgId}/teams/{teamId}/cards/{cardId}/status:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/CardId'
    patch:
      operationId: updateTeamCardStatus
      tags: [Teams]
      summary: Change a board card's workflow status
      description: |
        Moves the card on this team only and records the change. Entering an
        `automatic` status closes an open project card. `off` and `manual` do not
        change project lifecycle, and no status transition reopens a card.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/team/team.routes.js
      x-required-scopes: [teams:write, cards:write]
      x-sdk-methods:
        typescript: client.teams.cards.updateStatus
        python: client.teams.cards.update_status
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamCardStatusRequest'
      responses:
        '200':
          description: Updated board placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCardLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CardHistoryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/orgs/{orgId}/teams/{teamId}/cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/CardId'
    delete:
      operationId: removeTeamCard
      tags: [Teams]
      summary: Remove a card from a team board
      description: Removes only the board placement and records linked history; the project card remains.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/team/team.routes.js
      x-required-scopes: [teams:write, cards:write]
      x-sdk-methods:
        typescript: client.teams.cards.remove
        python: client.teams.cards.remove
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Card removed from this team board.
          headers:
            ETag:
              $ref: '#/components/headers/CardHistoryETag'
            X-Card-History-Head-Id:
