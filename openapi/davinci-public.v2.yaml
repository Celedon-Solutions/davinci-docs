openapi: 3.1.0
info:
  title: Davinci Public API
  version: 2.0.0
  description: |
    Public Routing Server API contract for Davinci integrations and official SDKs.

    Most operations live on the canonical `/api/v2/projects` mount and accept a
    personal access token (`dav_ak_live_…` / `dav_ak_test_…`) or browser access
    token. Evaluation-run creation is the deliberate exception: it accepts only a
    `purpose=automation` grant issued to a running Code execution.
    Project membership and role are checked on every user call, and an API key is
    additionally bounded by the permission ceiling derived from its scopes — a key
    can never exceed what its owner can do, and usually does less.

    Collaboration operations (invitations, membership changes, ownership transfer)
    are deliberately absent: they require a browser session and are not part of the
    programmatic surface.

    ## Two planes

    Most operations are **control plane**: they run on the Routing Server, take
    small requests, and answer quickly. A few are **data plane**, marked
    `x-plane: data`, and go straight to the machine holding your project — the only
    practical way to move multi-gigabyte files or hold a connection open for half
    an hour.

    Data-plane operations use a different host and a different credential. Create a
    session on a project and it returns both: a `dataPlane.url` to send to and a
    short-lived `dataPlane.token` (`dav_gr_…`, a *grant*) to send with. A grant
    reaches exactly one project, carries no more permission than the key that
    minted it, expires in minutes, and dies when its session closes. It is not
    interchangeable with an API key in either direction.

    The data-plane host never names a specific machine, so a project that moves
    between machines mid-session stays reachable at the same URL.
servers:
  - url: https://davinci-app.com
    description: Production (control plane)
  - url: https://davinci-app.com/data
    description: >-
      Production (data plane). Serves the operations marked `x-plane: data`, using a
      session's grant rather than an API key.
tags:
  - name: Projects
    description: Create, inspect, open, close, and delete projects, and manage their attached files.
  - name: Content
    description: |
      Read and write the objects a project is made of. These reach the running
      project rather than storage, so they see uncommitted work — and so they open
      the project if it is not already open.
  - name: Branches
    description: |
      Branches, commits, and the history of a single object. A commit captures the
      running project's state, so these operations need the branch loaded, which they
      arrange for the caller.
  - name: Sessions
    description: |
      A session opens a project, holds it open, and issues the grant that reaches the
      data plane. It is the programmatic equivalent of having a project open in a
      browser tab: while it lives, the project stays loaded.

      It is also where the agent lives. Send it a prompt, read its status from the
      session, read the transcript back, and stop a run that is going the wrong way.
  - name: AgentModels
    description: |
      Chat models available to your account. The returned keys are the values accepted
      by the session message API; availability follows your subscription, tenant, and
      any profile assigned to your account.
  - name: Tools
    description: |
      Invoke one of the agent's tools yourself, without the agent. Useful when you
      already know the operation you want and do not need a model to choose it — and
      when you want a deterministic result rather than an interpreted one.

      A tool is still held to the permissions of the credential invoking it, so a
      key cannot reach through a tool to something its scopes exclude.
  - name: Files
    description: |
      Data-plane file transfer. These reach your project's machine directly using a
      session's grant, which is what allows request bodies far larger than the
      control plane accepts.
  - name: Usage
    description: |
      What your models cost, broken down by model, project, session, or day. These
      read the usage ledger, which records one event per completed provider call —
      not your credit balance, which is `/api/v2/billing`.

      Usage is reported on an interval rather than per call, so a run that is still
      going may not be fully counted yet. Every response carries `asOf`, the moment
      the newest counted event was recorded, so you can see how current a total is
      instead of guessing.

      This is separate from `projects:read` on purpose: a key that reads your
      project data is not thereby allowed to see what you spend.
  - name: Evaluations
    description: |
      Lifecycle for the ephemeral target sandbox an evaluation runs against.
      Creation is available only to a `purpose=automation` grant issued to a
      running Code execution, so a sandbox always belongs to code rather than to
      a person's key. It returns a second, `purpose=evaluation` grant bound to
      the new sandbox; it never upgrades or replaces the source credential.
  - name: Tests
    description: |
      Asynchronously run an authored Test. The Test executes its linked Code
      object and applies its native evaluation criteria to derive the verdict.
      This is one way to start Code, not a prerequisite for anything the Code can
      do: the same function called directly holds the same authority.
security:
  - ApiKeyBearer: []
paths:
  /api/v2/agent/models:
    get:
      operationId: listAgentModels
      tags: [AgentModels]
      summary: List available agent models
      description: |
        Returns the chat models available through the calling account's effective LLM
        profile. Pass a model's `key` as `model` when sending an agent message, and
        use its `options` definitions to build `modelOptions`.

        The list can differ between accounts because subscription tier, tenant policy,
        and an account-specific profile can all affect it. Omitting `model` from a
        message uses `defaultModel`.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/agent/agent.routes.js
      x-required-scopes: [agent:message]
      x-sdk-methods:
        typescript: client.agentModels.list
        python: client.agent_models.list
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            const available = await client.agentModels.list();
            console.log('Default:', available.defaultModel);
            for (const model of available.models) {
              console.log(model.key, model.name);
              console.log(model.options);
            }
        - lang: python
          label: Python SDK
          source: |
            available = client.agent_models.list()
            print("Default:", available.default_model)
            for model in available.models:
                print(model.key, model.name)
                print(model.options)
      responses:
        '200':
          description: Models available to the calling account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScopes'
        '409':
          description: The account has no usable published LLM profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List accessible projects
      description: |
        Returns the caller's projects split into `owned` and `shared`. Each entry
        carries git branch state and an `inUse` flag indicating whether the project
        currently has a running Design Engine instance.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:read]
      x-sdk-methods:
        typescript: client.projects.list
        python: client.projects.list
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const { owned, shared } = await client.projects.list();
            for (const project of [...owned, ...shared]) {
              console.log(project.id, project.name, project.inUse);
            }
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                result = client.projects.list()
                for project in [*result.owned, *result.shared]:
                    print(project.id, project.name, project.in_use)
      responses:
        '200':
          description: The caller's owned and shared projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScopes'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      description: |
        Creates a project owned by the caller, or by `orgId` when supplied. Either
        `name` or `initialPrompt` is required. When `autoName` is set with an
        `initialPrompt`, the name is derived from the prompt.

        Send an `Idempotency-Key` header to make a retry safe. Creating a project
        writes a repository and an initial commit, and a duplicate is not reclaimed,
        so a request that times out after the server completed it would otherwise
        leave you choosing between a leaked project and a lost one. A repeat of the
        same key returns the project the first call created, with the same `201`.
      security:
        - ApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:manage]
      x-sdk-methods:
        typescript: client.projects.create
        python: client.projects.create
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const project = await client.projects.create({ name: 'Spacecraft' });
            console.log(project.id);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                project = client.projects.create(name="Spacecraft")
                print(project.id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Scope missing, project limit reached (`PROJECT_LIMIT_REACHED`), or no
            permission to create in the requested organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The Idempotency-Key is currently initializing a project, was reused
            with different create settings, or points to a result that is no
            longer available. Error code is `PROJECT_CREATE_IN_PROGRESS`,
            `IDEMPOTENCY_KEY_REUSED`, or `IDEMPOTENCY_RESULT_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get project metadata
      description: |
        Returns the project's stored metadata, including its owner, visibility,
        version, storage footprint, and effective collaborators.

        Use the permissions endpoint when you need to know what this credential may
        do with the project; those are reported separately because they are derived
        per credential rather than stored on the project.
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:read]
      x-sdk-methods:
        typescript: client.projects.get
        python: client.projects.get
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const { metadata } = await client.projects.get(projectId);
            console.log(metadata.name, metadata.visibility);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                result = client.projects.get(project_id)
                print(result.metadata.name, result.metadata.visibility)
      responses:
        '200':
          description: Project metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScopes'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update project metadata
      description: Updates any subset of name, description, visibility, readme, tags, or units.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:manage]
      x-sdk-methods:
        typescript: client.projects.update
        python: client.projects.update
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const { metadata } = await client.projects.update(projectId, {
              description: 'Launch vehicle upper stage',
            });
            console.log(metadata.description);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                result = client.projects.update(
                    project_id, description="Launch vehicle upper stage"
                )
                print(result.metadata.description)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project
      description: |
        Soft-deletes the project. Storage is released from the owner's balance and
        the project becomes invisible to normal reads; a system administrator can
        restore it for a retention window.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:manage]
      x-sdk-methods:
        typescript: client.projects.delete
        python: client.projects.delete
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            await client.projects.delete(projectId);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                client.projects.delete(project_id)
      responses:
        '204':
          description: Project deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/projects/{projectId}/open:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: openProject
      tags: [Projects]
      summary: Open a project
      description: |
        Loads the project onto a Design Engine replica, or returns the already-running
        instance. `alreadyLoaded` distinguishes the two.

        API-key callers receive lifecycle confirmation only. The `url` and
        `serverToken` fields that a browser receives are omitted, because
        `serverToken` is minted per project rather than per user and would let its
        holder act as any collaborator. Programmatic access to live project data will
        use short-lived project-scoped grants instead.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: client.projects.open
        python: client.projects.open
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const opened = await client.projects.open(projectId, { branch: 'main' });
            console.log(opened.branchName, opened.alreadyLoaded);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                opened = client.projects.open(project_id, branch="main")
                print(opened.branch_name, opened.already_loaded)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenProjectRequest'
      responses:
        '200':
          description: Project is loaded and ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            No Design Engine replica could take the project. Common codes are
            `PROJECT_SERVER_UNAVAILABLE` and `SERVICE_UNAVAILABLE`. Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v2/projects/{projectId}/close:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: closeProject
      tags: [Projects]
      summary: Close a project
      description: |
        Saves and unloads the running Design Engine instance. Closing a project that
        is not running succeeds without effect, so this is safe to call
        unconditionally in cleanup paths.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: client.projects.close
        python: client.projects.close
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            await client.projects.close(projectId);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                client.projects.close(project_id)
      responses:
        '200':
          description: Project closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/projects/{projectId}/branches:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectBranches
      tags: [Projects]
      summary: List project branches
      description: Returns the authoritative git branches for the project from storage.
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:read]
      x-sdk-methods:
        typescript: client.projects.listBranches
        python: client.projects.list_branches
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const { branches } = await client.projects.listBranches(projectId);
            console.log(branches.map((branch) => branch.name));
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                result = client.projects.list_branches(project_id)
                print([branch.name for branch in result.branches])
      responses:
        '200':
          description: Project branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBranchesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScopes'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createBranch
      tags: [Branches]
      summary: Create a branch
      description: |
        Branches from another branch at its latest commit, copying its committed
        content. Uncommitted work on the source is not carried over.

        Branch names are sanitized, so the created name is not always the requested
        one. `branch.name` is what was created and `sanitized` says whether it
        differs.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/projectGit.routes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: client.branches.create
        python: client.branches.create
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const { branch } = await client.branches.create(projectId, { name: 'thermal-study' });
            console.log(branch.name);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                result = client.branches.create(project_id, name="thermal-study")
                print(result.branch.name)
      parameters:
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Project not found, or the source branch does not exist. Error code is
            `SOURCE_BRANCH_NOT_FOUND` for the latter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            A branch of that name already exists (`BRANCH_ALREADY_EXISTS`), or the
            project is no longer running (`PROJECT_NOT_RUNNING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/GitFailed'
        '503':
          $ref: '#/components/responses/ProjectNotReady'
  /api/v2/projects/{projectId}/branches/{branch}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BranchPath'
    delete:
      operationId: deleteBranch
