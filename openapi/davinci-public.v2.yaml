      summary: Create an ephemeral evaluation sandbox
      description: |
        Creates a separate ephemeral project to evaluate against. The caller must
        hold the `purpose=automation` grant issued to a running Code execution,
        which is what binds the sandbox to code rather than to a person's key.
        The source project and execution are taken from the grant rather than
        accepted from the body.

        The response contains sandbox metadata and a second,
        `purpose=evaluation` grant/data-plane block bound to that sandbox. This
        target grant can seed and inspect the sandbox and drive its agent, but
        cannot access another project, account resources, or git routes.
      security:
        - ExecutionGrantBearer: []
      x-routing-server-source: RoutingServer/evaluationRun/evaluationRun.routes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: client.evaluations.create
