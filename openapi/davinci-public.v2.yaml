  /api/v2/projects/{projectId}/sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Open a session and mint a data-plane grant
      description: |
        Loads the project, holds it open, and returns the credential for reaching it
        directly.

        A project unloads shortly after nothing is connected to it, so a session is
        what keeps it resident between your requests. Poll the session (`getSession`)
        to both refresh the grant and signal that you are still working.

        The grant can never exceed the key that minted it. Omit `scopes` to inherit
        the key's own scopes; supply them to narrow the grant further, which is worth
        doing when one job needs less than the key can do.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [sessions:manage]
      x-sdk-methods:
        typescript: client.sessions.create
        python: client.sessions.create
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const session = await client.sessions.create(projectId);
            console.log(session.sessionId, session.dataPlane.url);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                session = client.sessions.create(project_id)
                print(session.session_id, session.data_plane.url)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: The session, with the grant needed to reach the data plane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: |
            Invalid request. Error code is `INVALID_SCOPES` for an unknown scope name
            or `INVALID_TTL` for a non-positive `ttlSeconds`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller lacks `project:connect` on this project, or asked for scopes
            the key does not hold (`INSUFFICIENT_SCOPES`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            The project could not be opened or its machine is unavailable. Error code
            is `PROJECT_NOT_READY`, `SERVER_NOT_AVAILABLE`, or `GRANT_PUSH_FAILED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/projects/{projectId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Read a session, refresh its grant, and check the agent
      description: |
        Returns the session with a **new** grant and revokes the previous one, so a
        leaked grant stops working at the next poll rather than at its expiry.

        This is also the keepalive, for both clocks that matter: the grant's expiry
        and the machine's idle timer. Call it well before `dataPlane.expiresAt` — the
        SDKs do this for you.

        `agent.status` is how you follow a run started with `sendAgentMessage`. It is
        reported here rather than on a route of its own precisely so that one poll
        keeps the session alive and tells you where the run is. `completed`, `failed`,
        and `paused` are terminal; `paused` is what a `stopAgent` produces. `unknown`
        means the machine could not be reached for this field alone — the grant in the
        same response is still good, so retry rather than recreating the session.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:read]
      x-sdk-methods:
        typescript: client.sessions.get
        python: client.sessions.get
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const refreshed = await client.sessions.get(projectId, sessionId);
            console.log(refreshed.dataPlane.expiresAt, refreshed.agent?.status);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                refreshed = client.sessions.get(project_id, session_id)
                print(refreshed.data_plane.expires_at, refreshed.agent.status)
      responses:
        '200':
          description: The session, with a freshly minted grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, or it belongs to another user. Error code is
            `SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The project this session opened is no longer running. Error code is
            `PROJECT_NOT_RUNNING`; create a new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSession
      tags: [Sessions]
      summary: Close a session
      description: |
        Releases the project and revokes every grant the session issued. Grants stop
        working immediately rather than at expiry, which is the point of closing a
        session rather than letting it lapse.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [sessions:manage]
      x-sdk-methods:
        typescript: client.sessions.delete
        python: client.sessions.delete
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            await client.sessions.delete(projectId, sessionId);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                client.sessions.delete(project_id, session_id)
      responses:
        '200':
          description: The session was closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, or it belongs to another user. Error code is
            `SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/projects/{projectId}/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: sendAgentMessage
      tags: [Sessions]
      summary: Send a prompt to the session's agent
      description: |
        Gives the agent something to do. Starts a run if none is going, and adds a turn
        to the conversation if one is.

        This returns as soon as the agent has accepted the prompt, not when it has
        finished — a run takes as long as the work takes. Follow it with `getSession`
        and read `agent.status`, or let the SDK's `waitUntilDone` do that for you.

        Acceptance is not the same as success. A `202` means the agent took the prompt;
        a `409` means it refused, which happens when the run it belonged to has ended.
        Recreate the session in that case rather than retrying the message.

        The agent can change anything in the project and spends credits doing it, which
        is why this needs the `agent:message` scope rather than a project write.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/agent/agent.routes.js
      x-required-scopes: [agent:message]
      x-sdk-methods:
        typescript: session.sendMessage
        python: session.send_message
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            await client.sessions.with(projectId, async (session) => {
              await session.sendMessage('Add a 10mm M3 standoff under each corner of the base plate');

              const final = await session.waitUntilDone();
              console.log(final.status);
            });
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                with client.sessions.create(project_id) as session:
                    session.send_message(
                        "Add a 10mm M3 standoff under each corner of the base plate"
                    )

                    final = session.wait_until_done()
                    print(final.status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentMessageRequest'
      responses:
        '202':
          description: The agent accepted the prompt. The run is now in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAgentMessageResponse'
        '400':
          description: |
            Invalid request. Error code is `MISSING_MESSAGE`, `MESSAGE_TOO_LARGE`,
            `INVALID_MESSAGE_ID`, `INVALID_CONTEXT`, `INVALID_PERSONA`,
            `UNKNOWN_PERSONA`, `INVALID_MODEL`, `UNKNOWN_MODEL`,
            `INVALID_MODEL_OPTIONS`, `INVALID_WEB_SEARCH`, `LLM_OPTION_UNKNOWN`,
            or `LLM_OPTION_VALUE_UNAVAILABLE`.

            `UNKNOWN_PERSONA` names a persona the project does not define, and
            carries `details.definedPersonas` — the ids that would have worked. The
            message is refused rather than run under a default persona you did not
            ask for.

            `UNKNOWN_MODEL` names a well-formed model key outside the calling
            account's effective profile and carries `details.availableModels`.

            An invalid model option identifies its model and option key in
            `details.model` and `details.option`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, it belongs to another user, or it belongs to a different
            project than the one in the path. Error code is `SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The agent refused the message (`MESSAGE_REFUSED`), or the project the
            session opened is no longer running (`PROJECT_NOT_RUNNING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listAgentMessages
      tags: [Sessions]
      summary: Read the session's conversation
      description: |
        The transcript: your prompts, the agent's replies and reasoning, and every tool
        it used with the result.

        `source` tells you where the answer came from. `live` is the running agent's own
        copy and is current. `persisted` is the saved copy, which is written when a run
        ends — so it is complete for a finished run but behind for a running one. `none`
        means there is no conversation yet.

        Entries are ordered oldest to newest and `limit` takes the most recent, which is
        usually what you want after a run.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/agent/agent.routes.js
      x-required-scopes: [projects:read]
      x-sdk-methods:
        typescript: session.messages
        python: session.messages
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const session = await client.sessions.get(projectId, sessionId);
            const transcript = await session.messages({ limit: 20 });
            for (const entry of transcript.messages) {
              console.log(entry.role, entry.kind, entry.text);
            }
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                session = client.sessions.resume(project_id, session_id)
                transcript = session.messages(limit=20)
                for entry in transcript.messages:
                    print(entry.role, entry.kind, entry.text)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Most recent entries to return.
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTranscript'
        '400':
          description: '`limit` is out of range. Error code is `INVALID_LIMIT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, it belongs to another user, or it belongs to a different
            project than the one in the path. Error code is `SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/projects/{projectId}/sessions/{sessionId}/stop:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: stopAgent
      tags: [Sessions]
      summary: Stop the agent without closing the session
      description: |
        Halts the current run. The session survives, the project stays open, and the
        conversation so far is kept — so you can send a new prompt afterwards without
        starting over. Use `deleteSession` when you actually want to finish.

        Stopping when nothing is running is not an error; `stopped` is `false` and the
        status is whatever it already was. That makes this safe to call defensively,
        for instance when abandoning a run you may or may not have started.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/agent/agent.routes.js
      x-required-scopes: [sessions:manage]
      x-sdk-methods:
        typescript: session.stop
        python: session.stop
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const session = await client.sessions.get(projectId, sessionId);
            const result = await session.stop();
            console.log(result.stopped, result.status);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                session = client.sessions.resume(project_id, session_id)
                result = session.stop()
                print(result.stopped, result.status)
      responses:
        '200':
          description: The run was halted, or there was none to halt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopAgentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, it belongs to another user, or it belongs to a different
            project than the one in the path. Error code is `SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The project this session opened is no longer running. Error code is
            `PROJECT_NOT_RUNNING`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/projects/{projectId}/sessions/{sessionId}/tools/invoke:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: invokeTool
      tags: [Tools]
      summary: Invoke one of the agent's tools directly
      description: |
        Runs a single tool and returns its result, with no model in the loop. Faster and
        deterministic where the agent is neither, and it spends no LLM credits.

        This needs a session because a tool belongs to one: the tools available are the
        ones the session's project has open, and the tool acts on that project's live
        state.

        A tool that refuses answers `422` with the tool's own message. Permission
        refusals are deliberately indistinguishable from "no such tool" — a key cannot
        use the error to discover what it is not allowed to do.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/agent/agent.routes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: session.invokeTool
        python: session.invoke_tool
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            await client.sessions.with(projectId, async (session) => {
              const result = await session.invokeTool({
                toolbox: 'Core',
                tool: 'ReadObject',
                params: { objectId },
              });
              console.log(result.content.text);
            });
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                with client.sessions.create(project_id) as session:
                    result = session.invoke_tool(
                        toolbox="Core",
                        tool="ReadObject",
                        params={"objectId": object_id},
                    )
                    print(result.content.text)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeToolRequest'
      responses:
        '200':
          description: The tool ran and returned a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeToolResponse'
        '400':
          description: |
            Invalid request. Error code is `MISSING_TOOL_TARGET`, `INVALID_TOOL_TARGET`,
            or `INVALID_PARAMS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, it belongs to another user, it belongs to a different
            project than the one in the path (`SESSION_NOT_FOUND`), or no such toolbox
            for this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            The project this session opened is no longer running. Error code is
            `PROJECT_NOT_RUNNING`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            The tool ran and refused: bad arguments, a precondition it needs, or a
            permission your credential does not hold. Error code is `TOOL_ERROR` and the
            message is the tool's own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: What you spent
      description: |
        Credits and tokens charged to your account, optionally narrowed by project,
        session, or time, and optionally broken down by model, project, session, or
        day.

        This reports your own usage. A project you share with collaborators returns
        what *you* spent on it, not the project's total — what someone else spends is
        their financial data, not the project's.

        Reads are eventually consistent with a live run: the engine reports usage on
        an interval, so check `asOf` before treating a total as final.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/usage/usage.routes.js
      x-required-scopes: [usage:read]
      x-sdk-methods:
