  /api/v2/projects/{projectId}/sessions/{sessionId}/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionUsage
      tags: [Usage]
      summary: What one session spent
      description: |
        What a single session's agent run cost. This is the granularity to use when
        you want to know the price of a specific piece of work rather than a month of
        it.

        A run still in progress will under-report until its last interval is flushed,
        so read `asOf` — or read this after `waitUntilDone` returns.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/usage/usage.routes.js
      x-required-scopes: [usage:read, projects:read]
      x-sdk-methods:
        typescript: session.usage
        python: session.usage
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - $ref: '#/components/parameters/UsageGroupBy'
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            await client.sessions.with(projectId, async (session) => {
              await session.sendMessage('Add a mounting bracket');
              await session.waitUntilDone();

              const usage = await session.usage();
              console.log(`That run cost ${usage.totals.credits} credits`);
            });
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                with client.sessions.create(project_id) as session:
                    session.send_message("Add a mounting bracket")
                    session.wait_until_done()

                    usage = session.usage()
                    print(f"That run cost {usage.totals.credits} credits")
      responses:
        '200':
          description: Usage totals for the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          description: |
            Invalid request. Error code is `INVALID_GROUP_BY` or `INVALID_RANGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No such session, it belongs to another user, or it belongs to a different
            project than the one in the path. Error code is `SESSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/file/upload/{ownerId}/{userId}/{projectId}/{connectionId}/{parentId}:
    parameters:
      - $ref: '#/components/parameters/DataPlaneOwnerId'
      - $ref: '#/components/parameters/DataPlaneUserId'
      - $ref: '#/components/parameters/DataPlaneProjectId'
      - $ref: '#/components/parameters/ConnectionId'
      - $ref: '#/components/parameters/ParentId'
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a file to a project
      x-plane: data
      description: |
        Sends a file to the machine holding your project and attaches it under
        `parentId` in the parts tree.

        Send this to `dataPlane.url`, not to the control-plane host, with
        `Authorization: Bearer {dataPlane.token}`. Supply the session's own
        `dataPlane.connectionId` as `connectionId`; the upload is applied through the
        session's live connection, so any other value is rejected.

        Bodies up to 2 GB are accepted and streamed rather than buffered.
      security:
        - GrantBearer: []
      x-routing-server-source: DesignEngine/src/api/routes/fileRoutes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: session.upload
        python: session.upload
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { readFile } from 'node:fs/promises';
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const session = await client.sessions.create(projectId);
            const result = await session.upload({
              file: await readFile('housing.step'),
              filename: 'housing.step',
              parentId: rootId,
            });
            console.log(result.fileId);
        - lang: python
          label: Python SDK
          source: |
            import os
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                session = client.sessions.create(project_id)
                with open("housing.step", "rb") as handle:
                    result = session.upload(handle, filename="housing.step", parent_id=root_id)
                print(result.file_id)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        '200':
          description: The file was stored and attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'
        '401':
          $ref: '#/components/responses/GrantRejected'
        '403':
          description: The grant does not carry `documents:write` on this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/ProjectMoved'
        '413':
          description: The file exceeds the maximum upload size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

