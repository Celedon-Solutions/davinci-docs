  /api/v2/projects/{projectId}/objects:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: addProjectObjects
      tags: [Content]
      summary: Add objects
      description: |
        Adds objects to the running project, opening it if needed. The write goes
        through the same path an interactive client uses, so parentage, layout, and
        the broadcast to anyone else in the project all happen as normal.

        The objects are in memory once this returns; they are in git only after a
        commit. A response reporting fewer objects than were sent does not happen —
        the request either applies in full or fails.

        Every object is checked against the schema for its `type` before anything
        is written, so one bad object fails the whole request and the project is
        left untouched. Any type the model defines can be written here; the 400
        names what was wrong with each object it refused.
      security:
        - ApiKeyBearer: []
      x-routing-server-source: RoutingServer/project/project.routes.js
      x-required-scopes: [projects:write]
      x-sdk-methods:
        typescript: client.content.addObjects
        python: client.content.add_objects
      x-codeSamples:
        - lang: typescript
          label: TypeScript SDK
          source: |
            import { DavinciClient } from '@celedon/davinci-sdk';

            const client = new DavinciClient({
              apiKey: process.env.DAVINCI_API_KEY!,
            });

            const { addedCount } = await client.content.addObjects(projectId, {
              objects: {
                [crypto.randomUUID()]: { type: 'requirement', name: 'Dry mass under 500 kg' },
              },
            });
            console.log(addedCount);
        - lang: python
          label: Python SDK
          source: |
            import os
            import uuid
            from davinci_sdk import DavinciClient

            with DavinciClient(api_key=os.environ["DAVINCI_API_KEY"]) as client:
                result = client.content.add_objects(
                    project_id,
                    objects={str(uuid.uuid4()): {"type": "requirement", "name": "Dry mass under 500 kg"}},
                )
                print(result.added_count)
      parameters:
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddObjectsRequest'
      responses:
        '201':
          description: Objects added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddObjectsResponse'
        '400':
          description: |
            Nothing was written. `INVALID_OBJECTS` means the `objects` map itself was
            missing, empty, or not a map. `INVALID_OBJECT` means at least one object
            failed its schema: `details.objects` maps each refused id to what is
            wrong with it, and `details.validTypes` lists every writable type when a
            `type` was the problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectNotRunning'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: |
            The project accepted the request but applied none of it. Error code is
            `OBJECTS_NOT_APPLIED`. Nothing was written; the request can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ProjectNotReady'
